version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 3
  groups:
    szl-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
      exclude-patterns:
      - torch*
      - transformers
      - accelerate
      - vllm
      - unsloth*
      - openai
- package-ecosystem: pip
  directories:
  - /
  # Dated pip-freeze records and run outputs are evidence, not manifests;
  # version updates must not rewrite them. Patterns are relative to the
  # directory above. exclude-paths does not apply to security updates.
  # Security updates still read any *requirements*.txt anywhere, so the
  # recorded training freeze of out/triage-unsloth-bf16 (published on the
  # Hub as requirements-lock.txt) is kept as requirements-lock.txt.recorded:
  # the pip fetcher reads only .txt/.in files, and the record stays byte-exact.
  exclude-paths:
  - env-freeze-*.txt
  - reports/**
  - out/**
  - output/**
  - evidence/**
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
    semver-major-days: 21
    semver-minor-days: 7
    semver-patch-days: 3
  groups:
    szl-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
      exclude-patterns:
      - torch*
      - transformers
      - accelerate
      - vllm
      - unsloth*
      - openai
