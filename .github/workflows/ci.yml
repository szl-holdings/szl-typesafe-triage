name: ci

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      # Exact commits observed on the existing v4/v5 upstream release lines.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install (no model or training dependencies)
        run: python -m pip install -e . pytest==9.0.2

      - name: Dependency consistency
        run: python -m pip check

      - name: Test suite (pytest and legacy unittest cases)
        run: python -m pytest tests -ra

      - name: CLI smoke test
        run: szl-triage decide "charged twice on invoice INV-2041, want a refund"

      - name: Legacy fixture gate (policy v1)
        run: python scripts/export_sft_dataset.py --check --policy policies/triage_policy.v1.json

      - name: Legacy fixture gate (policy v2)
        run: python scripts/export_sft_dataset.py --check --policy policies/triage_policy.v2.json
