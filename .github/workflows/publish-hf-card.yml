# One serialized, manual canonical-main card writer; no model/weight publication.
name: publish-hf-card
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Allowlisted canonical card"
        type: choice
        options: [retrain, study5, root_lora]
        default: retrain
        required: true
      expected_parent:
        description: "Exact current 40-character Hugging Face model commit"
        required: true
      expected_source_commit:
        description: "Exact independently reviewed 40-character canonical source commit"
        required: true
      expected_card_sha256:
        description: "Exact reviewed canonical README SHA-256"
        required: true
      credential_entry:
        description: "Explicit study5-only existing HF_TOKEN entry; never fail over"
        type: choice
        options: [existing_preference, study5_hf_token]
        default: existing_preference
        required: true
      publish:
        description: "Publish README only; false creates a source-verified plan"
        type: boolean
        default: false
        required: true
      diagnose:
        description: "Read-only identity and parent metadata checks for the existing credential entries"
        type: boolean
        default: false
        required: true
permissions:
  contents: read

concurrency:
  group: publish-hf-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require canonical main manual dispatch (never skip green)
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_CARD_SHA256: ${{ inputs.expected_card_sha256 }}
          CARD_TARGET: ${{ inputs.target }}
          CREDENTIAL_ENTRY: ${{ inputs.credential_entry }}
        run: |
          test "$GITHUB_REPOSITORY" = "szl-holdings/szl-typesafe-triage"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          [[ "$EXPECTED_CARD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CREDENTIAL_ENTRY" = "existing_preference" || ( "$CREDENTIAL_ENTRY" = "study5_hf_token" && "$CARD_TARGET" = "study5" ) ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install only the pinned publication SDK
        run: python -m pip install "huggingface_hub==1.33.0"
      - name: Plan or publish one source-bound card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_PROVIDER_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          HF_PROVIDER_FALLBACK_TOKEN: ${{ secrets.HF_TOKEN }}
          CARD_TARGET: ${{ inputs.target }}
          CREDENTIAL_ENTRY: ${{ inputs.credential_entry }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_CARD_SHA256: ${{ inputs.expected_card_sha256 }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          DIAGNOSE_REQUESTED: ${{ inputs.diagnose }}
        run: |
          args=(--target "$CARD_TARGET" --source-commit "$GITHUB_SHA" --expected-source-commit "$EXPECTED_SOURCE_COMMIT" --expected-card-sha256 "$EXPECTED_CARD_SHA256" --expected-parent "$EXPECTED_PARENT" --credential-entry "$CREDENTIAL_ENTRY" --receipt "$RUNNER_TEMP/card-publication-receipt.json")
          if [ "$PUBLISH_REQUESTED" = "true" ]; then args+=(--publish); fi
          if [ "$DIAGNOSE_REQUESTED" = "true" ]; then args+=(--diagnose); fi
          python scripts/publish_hf_card.py "${args[@]}"
      - name: Retain the success or failure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: card-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/card-publication-receipt.json
            ${{ runner.temp }}/card-publication-receipt.json.journal.jsonl
          if-no-files-found: error
          retention-days: 30
