# Publish one model card from this repository to its Hugging Face mirror.
# GitHub remains canonical. Hub is the mirror. Manual dispatch only: every publication is an explicit owner action.
# Missing provider authority fails the run; it never skips green.
name: publish-hf-card
on:
  workflow_dispatch:
    inputs:
      card:
        description: "Path of the card inside hf/ (e.g. szl-triage-retrain/README.md)"
        required: true
        default: "szl-triage-retrain/README.md"
      repo_id:
        description: "Hugging Face model repository id"
        required: true
        default: "SZLHOLDINGS/szl-triage-retrain"
permissions:
  contents: read

concurrency:
  group: publish-hf-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARD: ${{ github.event.inputs.card || 'szl-triage-retrain/README.md' }}
      REPO_ID: ${{ github.event.inputs.repo_id || 'SZLHOLDINGS/szl-triage-retrain' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate card offline (front matter, status banner, claim boundary)
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          p = pathlib.Path("hf") / os.environ["CARD"]
          if ".." in p.parts or not p.is_file():
              sys.exit("card path must be a file under hf/")
          t = p.read_text(encoding="utf-8")
          if not re.match(r"^---\nlicense: [a-z0-9.-]+\n", t):
              sys.exit("front matter must start with a license")
          for needle in ("Status:", "Claim boundary", "NOT_PROMOTABLE"):
              if needle not in t:
                  sys.exit("card is missing the required section: " + needle)
          print("card ok:", p, len(t), "bytes")
          PY
      - name: Require provider authority
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::No HF_ORG_TOKEN or HF_TOKEN secret is visible to this repository; publication is a failed check, not a skip."
            exit 1
          fi
      - name: Publish the card
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet "huggingface_hub>=0.30,<2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_file(path_or_fileobj="hf/" + os.environ["CARD"], path_in_repo="README.md",
                                 repo_id=os.environ["REPO_ID"], repo_type="model",
                                 commit_message="Publish model card from szl-typesafe-triage@" + os.environ["GITHUB_SHA"][:12])
          print("published:", info)
          PY
