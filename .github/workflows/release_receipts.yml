name: release-receipts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/verify_release_receipts.py

  verify-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/verify_seal.py

  release-promotable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Fail while any gate stage is BLOCKED
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("out/release_gate.json"))
          print("release_verdict:", r.get("release_verdict"))
          for n, s in r.get("stages", {}).items():
              print(n, s.get("verdict"), s.get("breaches"))
          sys.exit(0 if r.get("release_verdict") == "PROMOTABLE" else 1)
          PY