name: release-receipts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/verify_release_receipts.py

  verify-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/verify_seal.py

  release-promotable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Fail while any gate stage is BLOCKED
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("out/release_gate.json"))
          print("release_verdict:", r.get("release_verdict"))
          for n, s in r.get("stages", {}).items():
              print(n, s.get("verdict"), s.get("breaches"))
          sys.exit(0 if r.get("release_verdict") == "PROMOTABLE" else 1)
          PY