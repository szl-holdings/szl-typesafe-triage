name: release-receipts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/verify_release_receipts.py

  verify-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/verify_seal.py

  release-promotable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Recorded HOLD passes; promotion is not granted
        run: |
          python scripts/verify_release_receipts.py
          python - <<'PY'
          import json, sys
          r = json.load(open("out/release_gate.json"))
          verdict = r.get("release_verdict")
          print("release_verdict:", verdict)
          for n, s in r.get("stages", {}).items():
              print(n, s.get("verdict"), s.get("breaches"))
          # An explicit BLOCKED receipt is an honest hold. Do not rewrite it
          # to PROMOTABLE and do not fail the workflow for stating that hold.
          # PROMOTABLE here is only the receipt's own claim; this job does not
          # authorize promotion (the verifier reports NOT_ESTABLISHED).
          if verdict == "BLOCKED":
              print("PROMOTION: NOT_PROMOTABLE")
              sys.exit(0)
          if verdict == "PROMOTABLE":
              print("PROMOTION: NOT_ESTABLISHED")
              sys.exit(0)
          sys.exit(1)
          PY