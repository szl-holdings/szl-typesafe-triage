[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-triage"
version = "0.2.0"
description = "Governed, evidence-bound triage: a language model may extend reach but never hold authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen Lutar", email = "stephenlutar2@users.noreply.github.com" }]
keywords = ["triage", "governance", "evidence", "receipts", "pre-registration", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.4", "transformers>=4.44", "peft>=0.12"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-typesafe-triage"
Source = "https://github.com/szl-holdings/szl-typesafe-triage"

[project.scripts]
szl-triage = "szl_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
